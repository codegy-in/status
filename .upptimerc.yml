# Codegy uptime monitor. Every 5 min GitHub Actions checks each site, opens an
# issue on an outage and closes it on recovery (HQ is to read those issues).
#
# PUBLIC REPO: everything here is world-readable. Name client monitors by an
# opaque id (e.g. "c-017 site"), never the institute's name, and keep client
# URLs in repository secrets ($C017_SITE) so the client list stays private.
# HQ appends entries here when it onboards a client (hq README §9 step 7).
#
# Actions are disabled on this repo until GH_PAT and PLATFORM_HEALTH_URL
# are set; see OPERATIONS.md "Turning it on".
owner: codegy-in
repo: status

sites:
  - name: HQ
    url: https://hq.codegy.in/auth/login
  # The institute portal's login page, from the PLATFORM_HEALTH_URL secret:
  # the portal is served on clients' domains, so per the rule above its
  # address stays out of this file (see OPERATIONS.md).
  - name: Platform
    url: $PLATFORM_HEALTH_URL
  - name: Codegy website
    url: https://www.codegy.in

status-website:
  cname: status.codegy.in
  name: Codegy Status
  introTitle: "**Codegy** service status"
  introMessage: Live status of Codegy platforms and the institute sites we run.
  navbar:
    - title: Status
      href: /

# Outage issues are assigned so they show up in GitHub notifications.
assignees:
  - diwakargbof
